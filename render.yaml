# Render Blueprint for Podium (Builder.io Agent-Native Hackathon entry).
# Connect this repo in the Render dashboard and apply this file, or push it
# to GitHub and use "New + Blueprint". No LLM key is needed in env vars:
# the app uses Builder.io's model (Settings > Model > Use Builder.io).
services:
  - type: web
    name: podium
    env: node
    repo: https://github.com/Raga-vibe/podium
    branch: main
    buildCommand: pnpm install --ignore-scripts && pnpm build
    preDeployCommand: pnpm migrate:production
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: podium-db
          property: connectionString
      # Auth signing secret. Never commit a real value: set it in the
      # Render dashboard (generate one with: openssl rand -base64 32).
      # BETTER_AUTH_URL is inferred automatically.
      - key: BETTER_AUTH_SECRET
        sync: false
databases:
  - name: podium-db
    plan: free
